[package]
name = "codeharbor"
version = "0.1.0"
description = "A local Docker-based development environment manager."
authors = ["CodeHarbor contributors"]
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
